# This virtual host exists solely for HTTP-01 validation and redirect.
# It does not replace any pre-existing Nginx virtual hosts.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/polka-acme;
        try_files $uri =404;
        default_type text/plain;
    }
    location / {
        return 308 https://__DOMAIN__$request_uri;
    }
}
