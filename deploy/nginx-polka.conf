# Placeholders are filled by install.sh: __DOMAIN__ and __PORT__.
server {
    listen __PORT__ ssl;
    listen [::]:__PORT__ ssl;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 2g;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /static/ {
        alias /opt/polka/staticfiles/;
        expires 7d;
        access_log off;
    }

    location = /dav { rewrite ^ /dav/ last; }
    location /dav/ {
        # Strip /dav/ when forwarding; mount_path=/dav restores DAV hrefs.
        proxy_pass http://127.0.0.1:18082/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        add_header Content-Security-Policy "sandbox" always;
        add_header X-Content-Type-Options nosniff always;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_body_timeout 300s;
    }

    location / {
        # Windows may discover DAV capabilities at the origin before opening /dav.
        if ($request_method = OPTIONS) {
            add_header DAV "1,2";
            add_header MS-Author-Via DAV;
            return 200;
        }
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
