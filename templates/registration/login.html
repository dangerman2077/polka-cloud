{% extends 'base.html' %}{% block title %}Вход{% endblock %}{% block content %}
<section class="login"><h1>Войти в Polka</h1><p>Используйте учётную запись, которую выдал администратор.</p><form method="post">{% csrf_token %}
{% if form.errors %}<p role="alert">Проверьте логин и пароль.</p>{% endif %}
<label>Логин<input name="username" value="{{ form.username.value|default:'' }}" required autofocus autocomplete="username"></label><label>Пароль<input type="password" name="password" required autocomplete="current-password"></label>
<input type="hidden" name="next" value="{{ next }}"><button>Войти</button></form></section>{% endblock %}
